[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-live-studio-monitor"
version = "1.0.0"
description = "Monitors the TikTok LIVE Studio desktop app for restriction/warning/suspension/interruption/verification popups and alerts via Telegram."
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "windows-capture>=2.0; sys_platform == 'win32'",
    "numpy>=1.26",
    "ttkbootstrap>=2.2",
    "uiautomation>=2.0; sys_platform == 'win32'",
    "tzdata>=2024.1",
    "opencv-python-headless>=4.10",
    "psutil>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
windows-ocr = ["winocr>=0.0.13"]
tesseract = ["pytesseract>=0.3.10"]
rapidocr = ["rapidocr-onnxruntime>=1.3", "numpy"]
dev = ["pytest>=8", "pyinstaller>=6"]
hub = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "jinja2>=3.1",
       "itsdangerous>=2.2", "python-multipart>=0.0.9", "httpx>=0.27"]

[project.scripts]
studio-monitor = "studio_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
